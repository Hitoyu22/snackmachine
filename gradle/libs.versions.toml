
[versions]
kotlin-version = "2.1.10"
ktor-version = "3.1.2"
logback-version = "1.5.13"
koin = "4.0.2"
kotest = "5.9.1"
mockk-version = "1.14.2"
h2-version = "2.1.214"
sqlite-version = "3.49.1.0"
exposed = "0.60.0"
junit-jupiter-engine = "5.11.3"
jdk = "23"
kotlinx-serialization = "1.6.3"



[libraries]
ktor-server-content-negotiation = { module = "io.ktor:ktor-server-content-negotiation", version.ref = "ktor-version" }
ktor-server-core = { module = "io.ktor:ktor-server-core", version.ref = "ktor-version" }
ktor-serialization-kotlinx-json = { module = "io.ktor:ktor-serialization-kotlinx-json", version.ref = "ktor-version" }
ktor-server-netty = { module = "io.ktor:ktor-server-netty", version.ref = "ktor-version" }
logback-classic = { module = "ch.qos.logback:logback-classic", version.ref = "logback-version" }
ktor-server-config-yaml = { module = "io.ktor:ktor-server-config-yaml", version.ref = "ktor-version" }
ktor-server-test-host = { module = "io.ktor:ktor-server-test-host", version.ref = "ktor-version" }
ktor-server-resources = { module = "io.ktor:ktor-server-resources", version.ref = "ktor-version"}



# test
junit = { module = "org.jetbrains.kotlin:kotlin-test-junit5", version.ref = "kotlin-version" }
junit-jupiter-params = { module = "org.junit.jupiter:junit-jupiter-params", version = "5.10.0" }
kotlinx-coroutines-test = { module = "org.jetbrains.kotlinx:kotlinx-coroutines-test", version = "1.7.3" }
kotest-assertions-core = { module = "io.kotest:kotest-assertions-core", version.ref = "kotest" }
kotest-assertions-json = { module = "io.kotest:kotest-assertions-json", version.ref = "kotest" }
kotest-assertions-ktor = { module = "io.kotest.extensions:kotest-assertions-ktor", version = "2.0.0" }
kotest-property = { module = "io.kotest:kotest-property", version.ref = "kotest" }
mockk = { module = "io.mockk:mockk", version.ref = "mockk-version" }
ktor-client-content-negotiation = { module = "io.ktor:ktor-client-content-negotiation", version.ref = "ktor-version" }
junit-jupiter-engine = { module = "org.junit.jupiter:junit-jupiter-engine", version.ref = "junit-jupiter-engine" }

# Koin
koin-core-jvm = { module = "io.insert-koin:koin-core-jvm", version.ref="koin" }
koin-logger = { module = "io.insert-koin:koin-logger-slf4j", version.ref="koin" }
koin-test = { module = "io.insert-koin:koin-test", version.ref="koin" }
koin-ktor = { module = "io.insert-koin:koin-ktor", version.ref = "koin" }

exposed-core = { module = "org.jetbrains.exposed:exposed-core", version.ref = "exposed" }
exposed-crypt = { module = "org.jetbrains.exposed:exposed-crypt", version.ref = "exposed" }
exposed-dao = { module = "org.jetbrains.exposed:exposed-dao", version.ref = "exposed" }
exposed-jdbc = { module = "org.jetbrains.exposed:exposed-jdbc", version.ref = "exposed" }
exposed-kotlin-datetime = { module = "org.jetbrains.exposed:exposed-kotlin-datetime", version.ref = "exposed" }
h2 = { module = "com.h2database:h2", version.ref = "h2-version" }
sqlite = { module = "org.xerial:sqlite-jdbc", version.ref = "sqlite-version" }

# ktor Client
ktor-client-core-jvm = { module = "io.ktor:ktor-client-core-jvm", version.ref = "ktor-version" }
ktor-client-cio-jvm = { module = "io.ktor:ktor-client-cio-jvm", version.ref = "ktor-version" }
ktor-client-content-negotiation-jvm = { module = "io.ktor:ktor-client-content-negotiation-jvm", version.ref = "ktor-version" }
ktor-client-mock-jvm = { module = "io.ktor:ktor-client-mock-jvm", version.ref = "ktor-version" }
ktor-serialization-kotlinx-json-jvm = { module = "io.ktor:ktor-serialization-kotlinx-json-jvm", version.ref = "ktor-version" }

[plugins]
kotlin-jvm = { id = "org.jetbrains.kotlin.jvm", version.ref = "kotlin-version" }
ktor = { id = "io.ktor.plugin", version.ref = "ktor-version" }
kotlin-plugin-serialization = { id = "org.jetbrains.kotlin.plugin.serialization", version.ref = "kotlin-version" }

[bundles]
ktor = [
    "ktor-server-content-negotiation",
    "ktor-server-core",
    "ktor-serialization-kotlinx-json",
    "ktor-server-netty",
    "logback-classic",
    "ktor-server-config-yaml",
    "ktor-server-resources"
]
koin = [
    "koin-core-jvm",
    "koin-logger",
    "koin-ktor"
]

test = [
    "junit",
    "junit-jupiter-params",
    "kotlinx-coroutines-test",
    "koin-test",
    "kotest-assertions-core",
    "kotest-assertions-json",
    "kotest-assertions-ktor",
    "kotest-property",
    "mockk",
    "ktor-client-content-negotiation",
    "junit-jupiter-engine"
]

db = [
    "exposed-core",
    "exposed-crypt",
    "exposed-dao",
    "exposed-jdbc",
    "exposed-kotlin-datetime",
    "h2",
    "sqlite"
]

ktorClient = [
    "ktor-client-core-jvm",
    "ktor-client-cio-jvm",
    "ktor-client-content-negotiation-jvm",
    "ktor-client-mock-jvm",
    "ktor-serialization-kotlinx-json-jvm"
]
